services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # 将容器内的 workspace 映射到宿主机，数据不会因容器重启丢失
      # 使用具名 volume，由 Docker 自动管理，避免宿主机目录冲突
      - workspace_data:/app/workspace
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

volumes:
  workspace_data:
